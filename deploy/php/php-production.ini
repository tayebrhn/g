; ============================================================
; TCExam production PHP overrides
; appended to php.ini by deploy\install-node.ps1
; (later values override the php.ini-production defaults)
; ============================================================

; never leak errors to the users, always log them
display_errors = Off
log_errors = On

; large enough for the question importers and the emailed PDF generation
memory_limit = 512M
max_execution_time = 300

; question media, OMR scans and user import files
post_max_size = 64M
upload_max_filesize = 32M
max_file_uploads = 50

; bytecode cache for a fixed release (no timestamp checks:
; restart the PHP service after each deploy-release)
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0

; the app enforces its own cookie flags (K_COOKIE_*), keep the engine strict too
session.use_strict_mode = 1

; per-node paths, filled in by install-node.ps1:
;   error_log       = C:/tcexam/logs/php-error.log
;   upload_tmp_dir  = C:/tcexam/tmp
;   sys_temp_dir    = C:/tcexam/tmp
;   session.save_path = C:/tcexam/tmp
