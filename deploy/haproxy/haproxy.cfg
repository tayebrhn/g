# ============================================================
# TCExam load balancer - HAProxy alternative
# for a small Linux VM in front of the Windows application nodes
# (HAProxy has no Windows build; see DEPLOYMENT.md section 6)
# tokens: __SSL_PEM__ __APP1_HOST__ __APP2_HOST__
# ============================================================

global
    maxconn 20000
    log stdout format raw local0
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    log     global
    mode    http
    option  httplog
    option  forwardfor
    option  http-keep-alive
    timeout connect 5s
    timeout client  300s
    timeout server  300s
    timeout tunnel  3600s

frontend https-in
    bind *:443 ssl crt __SSL_PEM__ alpn h2,http/1.1
    http-request redirect scheme https unless { ssl_fc }
    default_backend tcexam_app

backend tcexam_app
    balance roundrobin
    # active health check on the static liveness file (no PHP, no database)
    option httpchk GET /health.txt
    http-check expect status 200
    server app01 __APP1_HOST__:80 check inter 5s fall 3 rise 2
    server app02 __APP2_HOST__:80 check inter 5s fall 3 rise 2

listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
