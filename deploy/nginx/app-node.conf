# ============================================================
# TCExam application node - complete nginx.conf
# generated by deploy\install-node.ps1 from deploy\nginx\app-node.conf
# tokens: __TCEXAM_ROOT__ __SERVER_NAME__ __REAL_IP_BLOCK__
#         __HTTP_REDIRECT_BLOCK__ __LISTEN_BLOCK__ __SSL_DIRECTIVES__
#         __FASTCGI_HTTPS__
# ============================================================

worker_processes  auto;

error_log  logs/error.log  warn;

events {
    worker_connections  2048;
}

http {
    include       mime.types;
    default_type   application/octet-stream;

    sendfile           on;
    keepalive_timeout  65;
    server_tokens      off;

__HTTP_REDIRECT_BLOCK__
    server {
        listen __LISTEN_BLOCK__;
        server_name __SERVER_NAME__;

__SSL_DIRECTIVES__
        root   __TCEXAM_ROOT__;
        index  index.php;

        client_max_body_size 64m;

__REAL_IP_BLOCK__
        # liveness endpoint for the load balancer (static file, no PHP, no database)
        location = /health.txt {
            access_log off;
        }

        # never serve the installer or the raw backup area
        location ^~ /install/      { return 404; }
        location ^~ /admin/backup/ { return 404; }

        # static assets: cache and stop logging misses
        location ~* \.(css|js|png|gif|jpe?g|svg|ico|woff2?|ttf|eot)$ {
            expires 7d;
            log_not_found off;
        }

        location ~ \.php$ {
            try_files       $fastcgi_script_name =404;
            fastcgi_pass    127.0.0.1:9000;
            fastcgi_read_timeout 300s;
            include         fastcgi_params;
            fastcgi_param   SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param   HTTPS __FASTCGI_HTTPS__;
        }
    }
}
