# ============================================================
# TCExam load balancer node - complete nginx.conf
# generated by deploy\install-node.ps1 -Mode loadbalancer
# from deploy\nginx\lb-node.conf
# tokens: __SERVER_NAME__ __SSL_CERT__ __SSL_KEY__
#         __APP1_HOST__ __APP1_PORT__ __APP2_HOST__ __APP2_PORT__
# ============================================================

worker_processes  auto;

error_log  logs/error.log  warn;

events {
    worker_connections  4096;
}

http {
    include       mime.types;
    default_type   application/octet-stream;

    sendfile           on;
    keepalive_timeout  65;
    server_tokens      off;

    upstream tcexam_app {
        least_conn;
        server __APP1_HOST__:__APP1_PORT__ max_fails=3 fail_timeout=15s;
        server __APP2_HOST__:__APP2_PORT__ max_fails=3 fail_timeout=15s;
        keepalive 16;
    }

    server {
        listen 80;
        server_name __SERVER_NAME__;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name __SERVER_NAME__;

        ssl_certificate      __SSL_CERT__;
        ssl_certificate_key  __SSL_KEY__;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_session_cache    shared:SSL:10m;

        add_header Strict-Transport-Security "max-age=31536000" always;

        client_max_body_size 64m;

        location / {
            proxy_pass          http://tcexam_app;
            proxy_http_version  1.1;
            proxy_set_header    Connection "";
            proxy_set_header    Host              $host;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto https;
            proxy_read_timeout  300s;
        }

        # load-balancer self liveness endpoint
        location = /lb-health {
            access_log off;
            return 200 "OK";
            add_header Content-Type text/plain;
        }
    }
}
