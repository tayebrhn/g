; ============================================================
; TCExam Production PHP Overrides for Docker
; ============================================================

; Resource Limits
memory_limit = 512M
max_execution_time = 300
max_input_time = 180

; File Uploads (Question Banks, Media, Bulk Candidate Files)
upload_max_filesize = 64M
post_max_size = 70M
max_file_uploads = 50

; Error Logging & Production Security
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php_errors.log

; Session Security
session.cookie_httponly = 1
session.cookie_secure = 0 ; Set to 1 when terminating TLS/HTTPS
session.cookie_samesite = "Lax"
session.use_strict_mode = 1

; OPcache High-Performance Caching
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.save_comments = 1
