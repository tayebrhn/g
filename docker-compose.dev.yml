# ============================================================
# TCExam — Development Docker Compose Configuration
# ============================================================
# Used in conjunction with docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Features:
#   - Live hot-reloading: host code is mounted directly into PHP-FPM
#   - Verbose debugging: display_errors=On, error_reporting=E_ALL
#   - Instant opcache invalidation (revalidate_freq=0)
#   - Exposed MariaDB port 3306 for external GUI tools (DBeaver, TablePlus, etc.)
# ============================================================

services:
  app:
    environment:
      APP_ENV: development
    volumes:
      - ./:/var/www/html
      - ./docker/php/php-dev.ini:/usr/local/etc/php/conf.d/99-tcexam-dev.ini:ro
      - cache_data:/var/www/html/cache
      - backup_data:/var/www/html/admin/backup

  web:
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - cache_data:/var/www/html/cache:ro

  db:
    ports:
      - "${DB_PORT_FORWARD:-3307}:3306"
