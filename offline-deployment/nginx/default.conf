server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html;
    index index.php index.html;

    client_max_body_size 70M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Root redirect to candidate portal
    location = / {
        return 302 /public/code/index.php;
    }

    # Liveness check endpoint
    location = /health.txt {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Restrict sensitive paths and administrative backups
    location ^~ /install/      { return 404; }
    location ^~ /admin/backup/ { return 404; }
    location ^~ /cache/backup/ { return 404; }
    location ~ ^/(test|\.git|shared/config)/ {
        deny all;
        return 404;
    }

    # Cache static assets
    location ~* \.(css|js|png|gif|jpe?g|svg|ico|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        log_not_found off;
    }

    # Pass PHP scripts to FastCGI server (dynamic DNS resolution for scaling)
    location ~ \.php$ {
        try_files $fastcgi_script_name =404;

        resolver 127.0.0.11 valid=5s ipv6=off;
        set $upstream_app app:9000;
        fastcgi_pass $upstream_app;

        fastcgi_index index.php;
        fastcgi_read_timeout 300s;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
    }

    # Deny access to hidden files (.env, .git, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
